<!DOCTYPE html>
<html>
<head>
    <title>Colors in CSS</title>
    <link rel="stylesheet" href="color.css">
</head>
<body>
    <h1>CSS color Formats</h1>

    <div class="box1">
        <h2>Color Name</h2>
        <p>This text uses color name red.</p>
    </div>

    <div class="box2">
        <h2>HEX Color</h2>
        <p>This text uses #ff0000.</p>
    </div>

    <div class="box3">
        <h2>RGB Color</h2>
        <p>This text uses rgb(255,0,0).</p>
    </div>

    <div class="box4">
        <h2>RGBA Color</h2>
        <p>This text uses rgba(255,0,0,0.5)</p>
    </div>

</body>
</html>
